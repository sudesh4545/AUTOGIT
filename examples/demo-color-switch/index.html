<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Switch</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080b14;color:white;font:600 20px system-ui}button{padding:16px 24px;border:1px solid #49b8ff;border-radius:14px;background:#111a2b;color:#fff;cursor:pointer}</style></head><body><button id="switch">CHANGE ACCENT</button><script>const colors=['#ff4566','#49b8ff','#a879ff','#31e6a1'];let i=0;switch.onclick=()=>{i=(i+1)%colors.length;document.body.style.background=`radial-gradient(circle at 50% 35%,${colors[i]}44,#080b14 55%)`;switch.style.borderColor=colors[i]}</script></body></html>
