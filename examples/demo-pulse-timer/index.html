<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulse Timer</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090d18;color:#f4f7ff;font:600 20px system-ui}.card{padding:32px;border:1px solid #ff4566;border-radius:20px;text-align:center;box-shadow:0 0 40px #ff456633}button{padding:12px 22px;border:0;border-radius:999px;background:#ff4566;color:white;font-weight:700;cursor:pointer}</style></head>
<body><main class="card"><div id="time">00:10</div><button id="start">START</button></main><script>let t=10,id;start.onclick=()=>{clearInterval(id);id=setInterval(()=>{time.textContent='00:'+String(--t).padStart(2,'0');if(t<=0){clearInterval(id);t=10}},1000)};</script></body>
</html>
